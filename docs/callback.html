<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KickStream Auth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E0E10;color:#EFEFF1;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}
.card{text-align:center;padding:2rem}
h1{color:#53FC18;font-size:1.5rem;margin-bottom:.5rem}
p{color:#ADADB1;font-size:.9rem;margin-top:.5rem}
.spinner{width:32px;height:32px;border:3px solid #333;border-top-color:#53FC18;border-radius:50%;animation:spin .8s linear infinite;margin:1rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#EB0400}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Connecting to TV...</h1>
  <p id="msg">Sending authorization to your TV.</p>
</div>
<!--
  Relay strategy: Submit a hidden form to the TV's HTTP server.
  Form submissions from HTTPS → HTTP are allowed by browsers (they show
  a brief "leaving secure site" interstitial but proceed), unlike fetch()
  and window.location.href which are blocked by mixed content policy.
-->
<form id="relayForm" method="GET" style="display:none">
</form>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state');

  if (!code || !state) {
    show('Missing parameters', 'Could not complete authorization.', true);
    return;
  }

  // State format: "<random_token>:<base64url_encoded_tv_callback_url>"
  var colonIdx = state.indexOf(':');
  if (colonIdx === -1) {
    show('Invalid state', 'Could not decode TV address.', true);
    return;
  }

  var randomToken = state.substring(0, colonIdx);
  var tvUrlEncoded = state.substring(colonIdx + 1);

  // Decode base64url -> TV's LAN callback URL
  var tvUrl;
  try {
    var b64 = tvUrlEncoded.replace(/-/g, '+').replace(/_/g, '/');
    tvUrl = atob(b64);
  } catch (e) {
    show('Decode error', 'Could not decode TV address: ' + e.message, true);
    return;
  }

  if (!tvUrl) {
    show('No TV address', 'Could not find TV callback URL.', true);
    return;
  }

  // Build the relay URL and try multiple methods to reach the TV

  // Method 1: Hidden form submission (most reliable HTTPS → HTTP)
  var form = document.getElementById('relayForm');
  form.action = tvUrl;

  var codeInput = document.createElement('input');
  codeInput.type = 'hidden';
  codeInput.name = 'code';
  codeInput.value = code;
  form.appendChild(codeInput);

  var stateInput = document.createElement('input');
  stateInput.type = 'hidden';
  stateInput.name = 'state';
  stateInput.value = randomToken;
  form.appendChild(stateInput);

  form.submit();
})();

function show(title, msg, isError) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('title').textContent = title;
  document.getElementById('title').className = isError ? 'err' : '';
  document.getElementById('msg').textContent = msg;
}
</script>
</body>
</html>
