<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KickStream Auth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E0E10;color:#EFEFF1;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}
.card{text-align:center;padding:2rem;max-width:400px}
h1{color:#53FC18;font-size:1.5rem;margin-bottom:.5rem}
p{color:#ADADB1;font-size:.9rem;margin-top:.5rem}
.err{color:#EB0400}
.btn{display:inline-block;background:#53FC18;color:#0E0E10;font-size:1.1rem;font-weight:700;padding:.8rem 2rem;border-radius:8px;text-decoration:none;margin-top:1rem;transition:background .2s}
.btn:active{background:#3ecc10}
.sub{font-size:.75rem;color:#666;margin-top:1rem}
</style>
</head>
<body>
<div class="card" id="card">
  <h1 id="title">Authorized!</h1>
  <p id="msg">Tap the button below to send the code to your TV.</p>
  <a id="relayLink" class="btn" href="#">Send to TV</a>
  <p class="sub" id="sub">Make sure your phone is on the same Wi-Fi as your TV.</p>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state');

  if (!code || !state) {
    show('Missing parameters', 'Could not complete authorization.', true);
    return;
  }

  // State format: "<random_token>:<base64url_encoded_tv_callback_url>"
  var colonIdx = state.indexOf(':');
  if (colonIdx === -1) {
    show('Invalid state', 'Could not decode TV address.', true);
    return;
  }

  var randomToken = state.substring(0, colonIdx);
  var tvUrlEncoded = state.substring(colonIdx + 1);

  // Decode base64url -> TV's LAN callback URL
  var tvUrl;
  try {
    var b64 = tvUrlEncoded.replace(/-/g, '+').replace(/_/g, '/');
    tvUrl = atob(b64);
  } catch (e) {
    show('Decode error', 'Could not decode TV address: ' + e.message, true);
    return;
  }

  if (!tvUrl) {
    show('No TV address', 'Could not find TV callback URL.', true);
    return;
  }

  // Build the full callback URL with code and state params
  var relayUrl = tvUrl + '?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(randomToken);

  // Set the link href — user taps to navigate (user-initiated HTTP is allowed)
  var link = document.getElementById('relayLink');
  link.href = relayUrl;
})();

function show(title, msg, isError) {
  document.getElementById('title').textContent = title;
  document.getElementById('title').className = isError ? 'err' : '';
  document.getElementById('msg').textContent = msg;
  document.getElementById('relayLink').style.display = 'none';
  document.getElementById('sub').style.display = 'none';
}
</script>
</body>
</html>
